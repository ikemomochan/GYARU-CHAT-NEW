<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#e8faf7" />
    <title>GYARU-CHAT</title>
    <link rel="stylesheet" href="/static/style.css?v=trial-output-visible-20260816" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="avatar" aria-hidden="true">り</div>
        <div class="identity">
          <h1>りりめろ</h1>
          <p>
            <span class="status-dot"></span>
            <span id="status-label">接続確認中</span>
            <span class="status-separator">·</span>
            <span id="trial-label">残り -- 回</span>
          </p>
        </div>
        <button id="clear-button" class="ghost-button" type="button">履歴を消す</button>
      </header>

      <section id="notice" class="notice hidden" role="status"></section>

      <section id="messages" class="messages" aria-live="polite">
        <div class="message-row assistant">
          <div class="bubble">
            あーし、おしゃべり系ギャルのりりめろ💖いっぱい話そー
          </div>
        </div>
      </section>

      <section id="trial-lock" class="trial-lock hidden" aria-live="polite">
        <div class="trial-card">
          <div class="trial-icon" aria-hidden="true">♡</div>
          <h2>体験版はここまで</h2>
          <p id="trial-lock-message">りりめろと話してくれてありがとー！体験回数を使い切ったよ。</p>
          <details>
            <summary>実装者はこちら</summary>
            <form id="debug-unlock-form" class="debug-unlock-form">
              <label for="debug-access-code">実装者用コード</label>
              <div>
                <input
                  id="debug-access-code"
                  type="password"
                  maxlength="256"
                  autocomplete="current-password"
                  required
                />
                <button type="submit">解除</button>
              </div>
              <p id="debug-unlock-message" class="debug-unlock-message"></p>
            </form>
          </details>
        </div>
      </section>

      <form id="chat-form" class="composer">
        <textarea
          id="message-input"
          rows="1"
          maxlength="20000"
          placeholder="メッセージを入力..."
          aria-label="メッセージ"
          required
        ></textarea>
        <button id="send-button" type="submit" aria-label="送信">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3.4 20.4 21 12 3.4 3.6l.2 6.5L16 12 3.6 13.9l-.2 6.5Z" />
          </svg>
        </button>
      </form>
    </main>
    <script src="/static/app.js?v=trial-output-visible-20260816" defer></script>
</body>
</html>
