<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#e8faf7" />
    <title>Ririmero Chat</title>
    <link rel="stylesheet" href="/static/style.css?v=english-ui-20260906" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="avatar" aria-hidden="true">R</div>
        <div class="identity">
          <h1>Ririmero</h1>
          <p>
            <span class="status-dot"></span>
            <span id="status-label">Checking connection...</span>
          </p>
        </div>
        <button id="new-chat-button" class="new-chat-button" type="button">
          New chat
        </button>
      </header>

      <section id="messages" class="messages" aria-live="polite">
        <div class="message-row assistant">
          <div class="bubble" lang="ja">やほ〜、今日はどしたん？ ゆっくり話してみてね。</div>
        </div>
      </section>

      <form id="chat-form" class="composer">
        <textarea
          id="message-input"
          rows="1"
          maxlength="20000"
          lang="ja"
          placeholder="Type a message..."
          aria-label="Message"
          required
        ></textarea>
        <button id="send-button" type="submit" aria-label="Send">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3.4 20.4 21 12 3.4 3.6l.2 6.5L16 12 3.6 13.9l-.2 6.5Z" />
          </svg>
        </button>
      </form>
    </main>
    <script src="/static/app.js?v=english-ui-20260906" defer></script>
  </body>
</html>
