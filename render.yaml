services:
  - type: web
    name: ririmero-chat
    runtime: python
    plan: free
    region: singapore
    branch: YANS-system
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: STRATEGY_MODEL
        value: gpt-6-luna
      - key: RESPONSE_MODEL
        value: gpt-6-luna
      - key: TONE_MODEL
        value: gpt-6-luna
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: OPENAI_REASONING_EFFORT
        value: low
      - key: OPENAI_TIMEOUT_SECONDS
        value: "30"
      - key: OPENAI_MAX_RETRIES
        value: "1"
      - key: MAX_OUTPUT_TOKENS
        value: "1000"
      - key: STYLE_TOP_K
        value: "5"
      - key: PRINCIPLE_RAG_TOP_K
        value: "5"
      - key: RESET_STATE_ON_START
        value: "true"
      - key: CHAT_RATE_LIMIT
        value: "12"
      - key: CHAT_RATE_WINDOW_SECONDS
        value: "60"
      - key: CHAT_ADMIN_CODE
        sync: false
      - key: CHAT_DEVICE_SECRET
        generateValue: true
      - key: CHAT_LOG_DB_PATH
        value: .data/chat_logs.db
